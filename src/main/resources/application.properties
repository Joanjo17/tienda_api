spring.application.name=TiendaAPI

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# CORS
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:*}

# admin default
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# jwt
security.jwt.private.key=${PRIVATE_KEY}
security.jwt.user.generator=${USER_GENERATOR}
security.jwt.ttl-seconds=${TTL_SECONDS}